name: Monitor esame mediatori

on:
  schedule:
    - cron: "17 7-19 * * *"
  repository_dispatch:
    types: [check-esame]
  workflow_dispatch: # avvio manuale dal tab Actions, sempre consentito

permissions:
  contents: write # serve per ricommittare lo snapshot

concurrency:
  group: monitor-esame
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verifica orario italiano
        id: gate
        run: |
          ORA=$(TZ=Europe/Rome date +%H)
          GIORNO=$(TZ=Europe/Rome date +%u)   # 1=lunedi' ... 7=domenica
          echo "Ora italiana: $ORA — giorno: $GIORNO"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Avvio manuale: procedo."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$GIORNO" -gt 5 ]; then
            echo "Weekend: salto il controllo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif echo " 09 10 11 12 13 14 15 16 17 18 " | grep -q " $ORA "; then
            echo "Slot valido: procedo."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fuori dagli slot previsti: salto il controllo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Cache browser Playwright
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Installa dipendenze
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Controlla il portale
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva lo stato
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --quiet --cached || git commit -m "snapshot $(date -u +%F_%H:%M)"
          git pull --rebase --autostash || true
          git push

      - name: Conferma controllo su Telegram
        if: steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d disable_notification=true \
            --data-urlencode text="✅ Controllo delle $(TZ=Europe/Rome date +%H:%M) eseguito"

      - name: Avviso errore su Telegram
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Il controllo delle $(TZ=Europe/Rome date +%H:%M) è fallito, guarda il tab Actions"
